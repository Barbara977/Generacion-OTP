name: CI/CD OTP Service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # actualizado

      - name: Set up Python
        uses: actions/setup-python@v5   # actualizado
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
